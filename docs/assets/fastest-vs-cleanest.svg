<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 595" width="1200" height="595" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica,Arial,sans-serif"><rect width="1200" height="595" rx="24" fill="#0E1416"/><text x="60" y="70" font-size="34" font-weight="800" fill="#F3F0E6">Same trip. Two roads. Different air.</text><text x="60" y="104" font-size="19" fill="#9FB0AA">Maps pick the fastest road, through traffic. Breatheasy finds the cleaner way, past parks.</text><rect x="60" y="140" width="700" height="400" rx="18" fill="#121a19"/><path d="M160 140 V540" stroke="#1d2726" stroke-width="2"/><path d="M260 140 V540" stroke="#1d2726" stroke-width="2"/><path d="M360 140 V540" stroke="#1d2726" stroke-width="2"/><path d="M460 140 V540" stroke="#1d2726" stroke-width="2"/><path d="M560 140 V540" stroke="#1d2726" stroke-width="2"/><path d="M660 140 V540" stroke="#1d2726" stroke-width="2"/><path d="M60 240 H760" stroke="#1d2726" stroke-width="2"/><path d="M60 340 H760" stroke="#1d2726" stroke-width="2"/><path d="M60 440 H760" stroke="#1d2726" stroke-width="2"/><rect x="360" y="180" width="220" height="130" rx="30" fill="#17402f"/><text x="470" y="296" text-anchor="middle" font-size="16" font-weight="600" fill="#5fbf8f">park</text><path d="M130 470 L390 440 L700 210" fill="none" stroke="#E5484D" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/><circle cx="269" cy="440" r="3.8" fill="#9a8f80" opacity=".7"/><circle cx="452" cy="278" r="4.5" fill="#9a8f80" opacity=".7"/><circle cx="257" cy="472" r="3.4" fill="#9a8f80" opacity=".7"/><circle cx="605" cy="261" r="2.5" fill="#9a8f80" opacity=".7"/><circle cx="521" cy="306" r="4.2" fill="#9a8f80" opacity=".7"/><circle cx="478" cy="311" r="3.8" fill="#9a8f80" opacity=".7"/><circle cx="264" cy="454" r="3.4" fill="#9a8f80" opacity=".7"/><circle cx="570" cy="296" r="4.8" fill="#9a8f80" opacity=".7"/><circle cx="379" cy="404" r="4.8" fill="#9a8f80" opacity=".7"/><circle cx="599" cy="220" r="2.7" fill="#9a8f80" opacity=".7"/><circle cx="675" cy="227" r="2.9" fill="#9a8f80" opacity=".7"/><circle cx="410" cy="329" r="3.8" fill="#9a8f80" opacity=".7"/><circle cx="495" cy="329" r="4.8" fill="#9a8f80" opacity=".7"/><circle cx="657" cy="258" r="2.5" fill="#9a8f80" opacity=".7"/><circle cx="658" cy="271" r="3.7" fill="#9a8f80" opacity=".7"/><circle cx="514" cy="304" r="3.7" fill="#9a8f80" opacity=".7"/><circle cx="258" cy="457" r="5.0" fill="#9a8f80" opacity=".7"/><circle cx="205" cy="482" r="2.5" fill="#9a8f80" opacity=".7"/><circle cx="319" cy="456" r="2.1" fill="#9a8f80" opacity=".7"/><circle cx="444" cy="323" r="3.0" fill="#9a8f80" opacity=".7"/><circle cx="671" cy="241" r="5.0" fill="#9a8f80" opacity=".7"/><circle cx="273" cy="435" r="2.1" fill="#9a8f80" opacity=".7"/><circle cx="235" cy="465" r="2.5" fill="#9a8f80" opacity=".7"/><circle cx="184" cy="488" r="4.9" fill="#9a8f80" opacity=".7"/><circle cx="631" cy="234" r="3.6" fill="#9a8f80" opacity=".7"/><circle cx="505" cy="306" r="3.9" fill="#9a8f80" opacity=".7"/><rect x="420" y="395" width="150" height="30" rx="15" fill="#3a1416"/><text x="495" y="416" text-anchor="middle" font-size="15" font-weight="700" fill="#E5484D">busy main road</text><circle cx="310" cy="451" r="15" fill="#E5484D" stroke="#fff" stroke-width="3"/><text x="310" y="456" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">!</text><circle cx="530" cy="330" r="15" fill="#E5484D" stroke="#fff" stroke-width="3"/><text x="530" y="335" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">!</text><path d="M130 470 C180 340, 320 260, 390 245 S620 200, 700 210" fill="none" stroke="#3FD39A" stroke-width="12" stroke-linecap="round"/><circle cx="130" cy="470" r="14" fill="#F3F0E6"/><text x="130" y="508" text-anchor="middle" font-size="15" fill="#9FB0AA">start</text><circle cx="700" cy="210" r="14" fill="#F3F0E6"/><text x="700" y="186" text-anchor="middle" font-size="15" fill="#9FB0AA">destination</text><rect x="800" y="140" width="340" height="185" rx="18" fill="#16201F" stroke="#E5484D" stroke-width="2"/><rect x="824" y="166" width="44" height="10" rx="5" fill="#E5484D"/><text x="882" y="177" font-size="15" font-weight="700" fill="#E5484D">WHAT MAPS SHOW</text><text x="824" y="216" font-size="24" font-weight="800" fill="#F3F0E6">Fastest route</text><text x="824" y="248" font-size="16" fill="#9FB0AA">through traffic exhaust</text><text x="824" y="272" font-size="16" fill="#9FB0AA">pollution spots on the way</text><text x="824" y="296" font-size="16" fill="#9FB0AA">what every maps app picks</text><rect x="800" y="355" width="340" height="185" rx="18" fill="#16201F" stroke="#3FD39A" stroke-width="2"/><rect x="824" y="381" width="44" height="10" rx="5" fill="#3FD39A"/><text x="882" y="392" font-size="15" font-weight="700" fill="#3FD39A">WHAT BREATHEASY SHOWS</text><text x="824" y="431" font-size="24" font-weight="800" fill="#F3F0E6">Cleanest route</text><text x="824" y="463" font-size="16" fill="#9FB0AA">past parks, off busy roads</text><text x="824" y="487" font-size="16" fill="#9FB0AA">fewer minutes in bad air</text><text x="824" y="511" font-size="16" fill="#9FB0AA">a few minutes more, at most</text><text x="60" y="572" font-size="14" fill="#9FB0AA">Illustration. Real routes, air and pollution spots are computed live for each trip.</text></svg>