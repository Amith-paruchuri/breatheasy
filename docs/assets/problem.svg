<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica,Arial,sans-serif"><rect width="1200" height="440" rx="24" fill="#0E1416"/><text x="60" y="78" font-size="34" font-weight="800" fill="#F3F0E6">The air on India's roads</text><text x="60" y="114" font-size="20" fill="#9FB0AA">Every commute and school run passes through it. No app says which street, or which hour, is cleaner.</text><rect x="60" y="150" width="255" height="220" rx="18" fill="#16201F"/><rect x="60" y="150" width="255" height="6" rx="3" fill="#E5484D"/><text x="84" y="232" font-size="64" font-weight="800" fill="#E5484D">6th</text><text x="84" y="282" font-size="19" font-weight="600" fill="#F3F0E6">most polluted country</text><text x="84" y="312" font-size="16" fill="#9FB0AA">India, 48.9 µg/m³ (2025)</text><rect x="335" y="150" width="255" height="220" rx="18" fill="#16201F"/><rect x="335" y="150" width="255" height="6" rx="3" fill="#E5484D"/><text x="359" y="232" font-size="64" font-weight="800" fill="#E5484D">20×</text><text x="359" y="282" font-size="19" font-weight="600" fill="#F3F0E6">the WHO limit in Delhi</text><text x="359" y="312" font-size="16" fill="#9FB0AA">yearly PM2.5 99.6 µg/m³</text><rect x="610" y="150" width="255" height="220" rx="18" fill="#16201F"/><rect x="610" y="150" width="255" height="6" rx="3" fill="#F2B84B"/><text x="634" y="232" font-size="64" font-weight="800" fill="#F2B84B">#1</text><text x="634" y="282" font-size="19" font-weight="600" fill="#F3F0E6">most polluted city on Earth</text><text x="634" y="312" font-size="16" fill="#9FB0AA">Loni, inside Delhi-NCR (2025)</text><rect x="885" y="150" width="255" height="220" rx="18" fill="#16201F"/><rect x="885" y="150" width="255" height="6" rx="3" fill="#E5484D"/><text x="909" y="232" font-size="64" font-weight="800" fill="#E5484D">1.67M</text><text x="909" y="282" font-size="19" font-weight="600" fill="#F3F0E6">deaths a year in India</text><text x="909" y="312" font-size="16" fill="#9FB0AA">from air pollution (2019)</text><text x="60" y="410" font-size="14" fill="#9FB0AA">Sources: IQAir World Air Quality Report 2025; Lancet Planetary Health 2021 (India State-Level Disease Burden Initiative).</text></svg>