<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica,Arial,sans-serif"><rect width="1200" height="560" rx="24" fill="#0E1416"/><text x="60" y="70" font-size="34" font-weight="800" fill="#F3F0E6">Where you go <tspan fill="#9FB0AA">×</tspan> when you go</text><text x="60" y="104" font-size="19" fill="#9FB0AA">Smog changes from street to street and from hour to hour. Breatheasy is the one tool that answers both.</text><rect x="250" y="140" width="440" height="150" rx="18" fill="#16201F" stroke="#2a3634" stroke-width="2"/><text x="470.0" y="209.0" text-anchor="middle" font-size="24" font-weight="800" fill="#F3F0E6">AQI apps and forecasts</text><text x="470.0" y="241.0" text-anchor="middle" font-size="16" fill="#9FB0AA">say when the air is bad, not which way to go</text><rect x="710" y="140" width="440" height="150" rx="18" fill="#123326" stroke="#3FD39A" stroke-width="2"/><text x="930.0" y="209.0" text-anchor="middle" font-size="24" font-weight="800" fill="#3FD39A">Breatheasy</text><text x="930.0" y="241.0" text-anchor="middle" font-size="16" fill="#9FB0AA">cleaner route + best time to leave + sensitive mode</text><rect x="250" y="310" width="440" height="150" rx="18" fill="#16201F" stroke="#2a3634" stroke-width="2"/><text x="470.0" y="379.0" text-anchor="middle" font-size="24" font-weight="800" fill="#F3F0E6">Navigation apps</text><text x="470.0" y="411.0" text-anchor="middle" font-size="16" fill="#9FB0AA">fastest route; air is never considered</text><rect x="710" y="310" width="440" height="150" rx="18" fill="#16201F" stroke="#2a3634" stroke-width="2"/><text x="930.0" y="379.0" text-anchor="middle" font-size="24" font-weight="800" fill="#F3F0E6">Route-only ideas</text><text x="930.0" y="411.0" text-anchor="middle" font-size="16" fill="#9FB0AA">a cleaner street, at whatever time you leave</text><text x="120" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#F2B84B" transform="rotate(-90 120 300)">WHEN ▶</text><text x="700" y="510" text-anchor="middle" font-size="18" font-weight="700" fill="#3FD39A">WHICH WAY ▶</text><text x="214" y="221.0" text-anchor="end" font-size="15" fill="#9FB0AA">knows</text><text x="214" y="391.0" text-anchor="end" font-size="15" fill="#9FB0AA">ignores</text><text x="470.0" y="486" text-anchor="middle" font-size="15" fill="#9FB0AA">ignores</text><text x="930.0" y="486" text-anchor="middle" font-size="15" fill="#9FB0AA">knows</text></svg>