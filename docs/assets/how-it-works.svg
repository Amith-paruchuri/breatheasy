<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica,Arial,sans-serif"><rect width="1200" height="400" rx="24" fill="#0E1416"/><text x="60" y="70" font-size="34" font-weight="800" fill="#F3F0E6">How it works</text><rect x="60" y="110" width="165" height="250" rx="18" fill="#16201F"/><circle cx="96" cy="150" r="20" fill="#7FB7FF"/><text x="96" y="157" text-anchor="middle" font-size="20" font-weight="800" fill="#0E1416">1</text><text x="78" y="210" font-size="21" font-weight="800" fill="#F3F0E6">Your trip</text><text x="78" y="242" font-size="15" fill="#9FB0AA">car, two-wheeler,</text><text x="78" y="264" font-size="15" fill="#9FB0AA">cycle or walk; or</text><text x="78" y="286" font-size="15" fill="#9FB0AA">just ask the</text><text x="78" y="308" font-size="15" fill="#9FB0AA">agent</text><path d="M228 235 l10 0" stroke="#9FB0AA" stroke-width="2"/><rect x="243" y="110" width="165" height="250" rx="18" fill="#16201F"/><circle cx="279" cy="150" r="20" fill="#7FB7FF"/><text x="279" y="157" text-anchor="middle" font-size="20" font-weight="800" fill="#0E1416">2</text><text x="261" y="210" font-size="21" font-weight="800" fill="#F3F0E6">Routes</text><text x="261" y="242" font-size="15" fill="#9FB0AA">Google routes,</text><text x="261" y="264" font-size="15" fill="#9FB0AA">side streets,</text><text x="261" y="286" font-size="15" fill="#9FB0AA">detours past</text><text x="261" y="308" font-size="15" fill="#9FB0AA">parks and lakes</text><path d="M411 235 l10 0" stroke="#9FB0AA" stroke-width="2"/><rect x="426" y="110" width="165" height="250" rx="18" fill="#16201F"/><circle cx="462" cy="150" r="20" fill="#7FB7FF"/><text x="462" y="157" text-anchor="middle" font-size="20" font-weight="800" fill="#0E1416">3</text><text x="444" y="210" font-size="21" font-weight="800" fill="#F3F0E6">Air on each</text><text x="444" y="242" font-size="15" fill="#9FB0AA">PM2.5 on a 500 m</text><text x="444" y="264" font-size="15" fill="#9FB0AA">grid (Google Air</text><text x="444" y="286" font-size="15" fill="#9FB0AA">Quality) + busy</text><text x="444" y="308" font-size="15" fill="#9FB0AA">roads and parks</text><text x="444" y="330" font-size="15" fill="#9FB0AA">(OpenStreetMap)</text><path d="M594 235 l10 0" stroke="#9FB0AA" stroke-width="2"/><rect x="609" y="110" width="165" height="250" rx="18" fill="#16201F"/><circle cx="645" cy="150" r="20" fill="#3FD39A"/><text x="645" y="157" text-anchor="middle" font-size="20" font-weight="800" fill="#0E1416">4</text><text x="627" y="210" font-size="21" font-weight="800" fill="#F3F0E6">Rank</text><text x="627" y="242" font-size="15" fill="#9FB0AA">lowest average</text><text x="627" y="264" font-size="15" fill="#9FB0AA">PM2.5 within your</text><text x="627" y="286" font-size="15" fill="#9FB0AA">time budget;</text><text x="627" y="308" font-size="15" fill="#9FB0AA">stricter in</text><text x="627" y="330" font-size="15" fill="#9FB0AA">sensitive mode</text><path d="M777 235 l10 0" stroke="#9FB0AA" stroke-width="2"/><rect x="792" y="110" width="165" height="250" rx="18" fill="#16201F"/><circle cx="828" cy="150" r="20" fill="#F2B84B"/><text x="828" y="157" text-anchor="middle" font-size="20" font-weight="800" fill="#0E1416">5</text><text x="810" y="210" font-size="21" font-weight="800" fill="#F3F0E6">Best time</text><text x="810" y="242" font-size="15" fill="#9FB0AA">the same route</text><text x="810" y="264" font-size="15" fill="#9FB0AA">leaving now or in</text><text x="810" y="286" font-size="15" fill="#9FB0AA">30 to 120 min,</text><text x="810" y="308" font-size="15" fill="#9FB0AA">from the hourly</text><text x="810" y="330" font-size="15" fill="#9FB0AA">forecast</text><path d="M960 235 l10 0" stroke="#9FB0AA" stroke-width="2"/><rect x="975" y="110" width="165" height="250" rx="18" fill="#16201F"/><circle cx="1011" cy="150" r="20" fill="#3FD39A"/><text x="1011" y="157" text-anchor="middle" font-size="20" font-weight="800" fill="#0E1416">6</text><text x="993" y="210" font-size="21" font-weight="800" fill="#F3F0E6">Go</text><text x="993" y="242" font-size="15" fill="#9FB0AA">Google Maps</text><text x="993" y="264" font-size="15" fill="#9FB0AA">follows the same</text><text x="993" y="286" font-size="15" fill="#9FB0AA">streets, pinned</text></svg>