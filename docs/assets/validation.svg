<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica,Arial,sans-serif"><rect width="1200" height="470" rx="24" fill="#0E1416"/><text x="60" y="70" font-size="34" font-weight="800" fill="#F3F0E6">Does it work? Measured, in public</text><text x="60" y="104" font-size="19" fill="#9FB0AA">Against India's monitoring stations (CPCB via OpenAQ) and on real commutes. Updated every 3 hours.</text><rect x="60" y="140" width="255" height="260" rx="18" fill="#16201F"/><rect x="60" y="140" width="255" height="6" rx="3" fill="#3FD39A"/><text x="84" y="218" font-size="60" font-weight="800" fill="#3FD39A">85%</text><text x="84" y="254" font-size="20" font-weight="700" fill="#F3F0E6">right order</text><text x="84" y="286" font-size="15" fill="#9FB0AA">For 1,417 pairs of stations</text><text x="84" y="307" font-size="15" fill="#9FB0AA">in the same city,</text><text x="84" y="328" font-size="15" fill="#9FB0AA">Breatheasy said which place</text><text x="84" y="349" font-size="15" fill="#9FB0AA">was dirtier correctly 85%</text><text x="84" y="370" font-size="15" fill="#9FB0AA">of the time.</text><rect x="335" y="140" width="255" height="260" rx="18" fill="#16201F"/><rect x="335" y="140" width="255" height="6" rx="3" fill="#3FD39A"/><text x="359" y="218" font-size="60" font-weight="800" fill="#3FD39A">0.87</text><text x="359" y="254" font-size="20" font-weight="700" fill="#F3F0E6">correlation</text><text x="359" y="286" font-size="15" fill="#9FB0AA">with official station</text><text x="359" y="307" font-size="15" fill="#9FB0AA">readings: 220 comparisons</text><text x="359" y="328" font-size="15" fill="#9FB0AA">at 165 stations, checked</text><text x="359" y="349" font-size="15" fill="#9FB0AA">every 3 hours.</text><rect x="610" y="140" width="255" height="260" rx="18" fill="#16201F"/><rect x="610" y="140" width="255" height="6" rx="3" fill="#7FB7FF"/><text x="634" y="218" font-size="60" font-weight="800" fill="#7FB7FF">100%</text><text x="634" y="254" font-size="20" font-weight="700" fill="#F3F0E6">Google Maps match</text><text x="634" y="286" font-size="15" fill="#9FB0AA">median share of Google's</text><text x="634" y="307" font-size="15" fill="#9FB0AA">path on our route, 127 real</text><text x="634" y="328" font-size="15" fill="#9FB0AA">trips in 5 cities (phone</text><text x="634" y="349" font-size="15" fill="#9FB0AA">and computer).</text><rect x="885" y="140" width="255" height="260" rx="18" fill="#16201F"/><rect x="885" y="140" width="255" height="6" rx="3" fill="#F2B84B"/><text x="909" y="218" font-size="60" font-weight="800" fill="#F2B84B">26%</text><text x="909" y="254" font-size="20" font-weight="700" fill="#F3F0E6">cleaner by timing</text><text x="909" y="286" font-size="15" fill="#9FB0AA">best case from leaving</text><text x="909" y="307" font-size="15" fill="#9FB0AA">later; in Mumbai the median</text><text x="909" y="328" font-size="15" fill="#9FB0AA">was 17% cleaner within 2</text><text x="909" y="349" font-size="15" fill="#9FB0AA">hours.</text><text x="60" y="440" font-size="15" fill="#9FB0AA">Snapshot 14 Nov 2026. Current numbers: breatheasy-2lqwczvwyq-el.a.run.app/validation · Method and limits: VALIDATION.md</text></svg>