name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: breatheasy
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: breatheasy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U breatheasy" --health-interval 2s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock pytest pytest-asyncio
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (Postgres)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://breatheasy:ci@localhost:5432/breatheasy

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t breatheasy:ci .
