# Automatic deploys: every push to the main branch on GitHub runs this in Cloud Build.
# Tests first (a failing change never goes live), then build the image and roll it out
# to the existing Cloud Run service. Env vars, secrets and the database connection
# set by deploy/cloudrun/deploy.sh are kept as they are.
substitutions:
  _REGION: asia-south1
  _SERVICE: breatheasy
  _REPO: breatheasy
  _DATA_BUCKET: ${PROJECT_ID}-breatheasy-data

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

timeout: 3600s

steps:
  - id: tests
    name: python:3.12-slim
    dir: backend
    entrypoint: bash
    args:
      - -c
      - pip install -q -r requirements.lock pytest pytest-asyncio && python -m pytest -q

  # Street-level map layer (parks, lakes, main roads) from OpenStreetMap. Built once
  # and kept in a bucket. If the bucket has none yet, it is copied out of the version
  # that is live now; only if that fails is it rebuilt from OpenStreetMap (time-limited,
  # so a slow map server can never block a deploy). Delete the bucket file to refresh it.
  - id: map-layer-saved
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        mkdir -p backend/app/data
        gcloud storage buckets describe gs://${_DATA_BUCKET} >/dev/null 2>&1 \
          || gcloud storage buckets create gs://${_DATA_BUCKET} --location=${_REGION} --uniform-bucket-level-access
        if gcloud storage cp gs://${_DATA_BUCKET}/environment.json.gz backend/app/data/environment.json.gz 2>/dev/null; then
          echo "Using the saved map layer"; touch /workspace/.map_saved
        else
          gcloud run services describe ${_SERVICE} --region=${_REGION} \
            --format='value(spec.template.spec.containers[0].image)' > /workspace/.live_image 2>/dev/null || true
          echo "No saved map layer; live image: $$(cat /workspace/.live_image 2>/dev/null)"
        fi

  - id: map-layer-from-live
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        OUT=backend/app/data/environment.json.gz
        IMG=$$(cat /workspace/.live_image 2>/dev/null)
        if [ ! -f $$OUT ] && [ -n "$$IMG" ]; then
          docker pull -q "$$IMG" && CID=$$(docker create "$$IMG") \
            && docker cp "$$CID:/app/app/data/environment.json.gz" $$OUT \
            && echo "Copied the map layer from the live version" || echo "Live version has no map layer"
          [ -n "$$CID" ] && docker rm "$$CID" >/dev/null || true
        fi
        true

  # Adds any city still missing from the layer (Delhi-NCR, Mumbai, Kolkata, Bengaluru,
  # Hyderabad); cities already built are kept, so normally this takes seconds. Saved
  # after every city, so a slow map server only delays the rest to the next deploy.
  # (Runs in a Python image: the Cloud SDK image has no python3.)
  - id: map-layer-finish
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        OUT=backend/app/data/environment.json.gz
        BEFORE=$$(md5sum $$OUT 2>/dev/null | cut -c1-32)
        timeout 1800 python3 backend/scripts/build_environment.py \
          || echo "WARNING: not every city was built this time; the rest will be added on the next deploy"
        rm -f backend/app/data/*.tmp
        [ -f $$OUT ] || { echo "WARNING: map layer unavailable; deploying without park and road context"; exit 0; }
        AFTER=$$(md5sum $$OUT | cut -c1-32)
        [ "$$BEFORE" != "$$AFTER" ] && touch /workspace/.map_changed
        true

  - id: map-layer-save
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        if [ -f /workspace/.map_changed ]; then
          gcloud storage cp backend/app/data/environment.json.gz gs://${_DATA_BUCKET}/environment.json.gz \
            && echo "Saved the updated map layer for future deploys"
        fi
        true

  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/app:${SHORT_SHA}", "."]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/app:${SHORT_SHA}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/app:${SHORT_SHA}
      - --region=${_REGION}

